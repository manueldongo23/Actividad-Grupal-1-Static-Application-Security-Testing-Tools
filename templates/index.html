{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>Create Note</h2>
    <form action="{{ url_for('add') }}" method="POST">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required maxlength="100" placeholder="Enter note title...">
        </div>
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" required maxlength="1000" placeholder="Write your note here..."></textarea>
        </div>
        <button type="submit" class="btn-primary">Save Note</button>
    </form>
</div>

<div class="card">
    <h2>Search Notes</h2>
    <form action="{{ url_for('index') }}" method="GET" class="search-form">
        <input type="text" name="search" value="{{ search_query }}" placeholder="Search by title..." maxlength="100">
        <button type="submit" class="btn-primary">Search</button>
    </form>
</div>

<div class="notes-container">
    <h2>Your Notes</h2>
    {% if notes %}
        <div class="notes-grid">
            {% for note in notes %}
            <div class="note-card">
                <div class="note-header">
                    <span class="note-title">{{ note.title }}</span>
                    <span class="note-date">{{ note.created_at }}</span>
                </div>
                <div class="note-content">{{ note.content }}</div>
                <div class="note-footer">
                    <form action="{{ url_for('delete', note_id=note.id) }}" method="POST">
                        <button type="submit" class="btn-danger" onclick="return confirm('Are you sure you want to delete this note?');">Delete</button>
                    </form>
                </div>
            </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="empty-state">
            <p>No notes found. Create one above!</p>
        </div>
    {% endif %}
</div>
{% endblock %}
